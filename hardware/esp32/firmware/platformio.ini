; UNTESTED SKELETON. The exact board/variant has not been identified yet (no ESP32 was
; connected during Phase 0/1). `esp32dev` is a generic placeholder; confirm the real
; board (chip via `pio device list` / `esptool chip_id`) and update this before flashing.
[env:generic-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7
